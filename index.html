<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал зала">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#102a4c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Журнал зала</title>
<style>
:root{color-scheme:light dark;--bg:#f4f3ef;--card:#fff;--ink:#0b0b0b;--ink2:#5a5955;--ink3:#8a8880;--line:#e3e1db;--blue:#2a78d6;--blue-ink:#fff;--g1:#2a78d6;--g2:#eb6834;--good:#0a7a3a;--bad:#c23b3a;--field:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8f8d84;--line:#34343a;--blue:#3987e5;--g1:#3987e5;--g2:#d95926;--good:#4cc07a;--bad:#e66767;--field:#27272b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 84px)}
#view{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:6px 2px 10px}
h2{font-size:18px;margin:14px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.muted{color:var(--ink3);font-size:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;min-height:46px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:15px}
.btn.block{display:block;width:100%;text-align:center;margin:8px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink2);padding:11px;font:inherit;font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}
.exh{display:flex;align-items:center;gap:8px}
.exh b{font-size:17px;flex:1}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;border:0}
.chip.g1{background:var(--g1)}.chip.g2{background:var(--g2)}
.prev{font-size:14px;color:var(--ink2);margin:4px 0 6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 40px 34px;gap:6px;align-items:center;margin:6px 0}
.set .n{color:var(--ink3);font-size:13px;text-align:center}
.st{display:flex;align-items:center;gap:4px}
.st button{width:34px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;padding:0}
.st input{text-align:center;padding:9px 2px;height:42px;min-width:0}
.wbtn{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink3);font-weight:700;padding:0}
.wbtn.on{background:#e8b400;color:#000;border-color:#e8b400}
.rirrow{display:flex;gap:5px;align-items:center;margin:-2px 0 8px 26px;flex-wrap:wrap;font-size:13px}
.rb{height:34px;min-width:38px;padding:0 9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink2,var(--ink));font-size:13px}
.rb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.x{border:0;background:none;color:var(--ink3);font-size:20px;height:42px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;border:0;background:none;color:var(--ink3);font:inherit;font-size:12px;font-weight:600;padding:6px 0}
.tabs button span{display:block;font-size:22px}
.tabs button.on{color:var(--blue)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 78px);background:#16161a;color:#fff;border-radius:12px;padding:12px 14px;z-index:30;text-align:center;font-weight:600;max-width:520px;margin:0 auto}
.timer{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 74px);background:var(--blue);color:#fff;border:0;border-radius:24px;padding:11px 16px;font:inherit;font-weight:700;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.timer.done{background:var(--bad)}
.timer.idle{background:var(--card);color:var(--ink);border:2px solid var(--blue)}
.tmenu{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 128px);display:flex;gap:6px;z-index:21}
.tmenu button{border:0;border-radius:18px;padding:9px 13px;font:inherit;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);max-height:85vh;overflow:auto}
.li{display:flex;align-items:center;gap:8px;padding:12px 8px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--field);color:var(--ink2)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink2);font-size:11px}
.thumb{width:68px;height:46px;object-fit:cover;border-radius:8px;background:var(--field);flex:none}
.vid{display:block;padding:9px 0;border-bottom:1px solid var(--line);color:var(--blue);text-decoration:none}
.vid small{display:block;color:var(--ink3)}
details.card summary{cursor:pointer}
.how{margin:8px 0;padding-left:20px}.how li{margin:6px 0}
.tip{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;background:var(--field);border-left:4px solid var(--ink3)}
.tip.ok{border-left-color:var(--good)}.tip.info{border-left-color:var(--blue)}.tip.warn,.tip.caution{border-left-color:#e8b400}.tip.stop{border-left-color:var(--bad)}
.tip .btn{margin-top:6px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--field)}
.set.head{margin:4px 0 0}.set.head span{font-size:12px;color:var(--ink3);text-align:center;line-height:1.15}
.btn.sm.danger{color:var(--bad)}
.banner .btn{margin-top:6px;background:#fff;color:#000}
.banner{background:#e8b400;color:#000;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="view"></div>
<div id="timerhost"></div>
<div id="modalhost"></div>
<div id="toasthost"></div>
<nav class="tabs" id="tabs">
  <button data-tab="today"><span>🏋️</span>Сегодня</button>
  <button data-tab="hist"><span>📒</span>История</button>
  <button data-tab="base"><span>📚</span>База</button>
  <button data-tab="prog"><span>📈</span>Прогресс</button>
  <button data-tab="body"><span>🧍</span>Тело</button>
  <button data-tab="more"><span>⚙️</span>Ещё</button>
</nav>

<script src="exdb.js"></script>
<script src="exvideo.js"></script>
<script src="coach.js"></script>
<script src="body.js"></script>
<script>
'use strict';
/* ====================== каталог упражнений ====================== */
const BASE = {
  'Присед со штангой':'load','Жим ногами':'load','Жим лёжа':'load','Узкий жим лёжа':'load','Отрицательный жим (штанга)':'load',
  'Горизонтальная тяга (блок)':'load','Вертикальная тяга (блок)':'load','Тяга Т-гриф':'load','Тяга штанги в наклоне':'load',
  'Подъём штанги к подбородку':'load','Жим вверх (Смит)':'load','Армейский жим (штанга)':'load','Бицепс со штангой':'load',
  'Французский жим':'load','Мёртвая / румынская тяга':'load','Сгибание ног лёжа':'load','Разгибание ног':'load',
  'Шраги (Смит)':'load','Бицепс (тренажёр)':'load','Трицепс (тренажёр)':'load','Сведение рук (тренажёр)':'load',
  'Аддуктор/абдуктор (тренажёр)':'load','Ноги (тренажёр по фото, 68 кг)':'load',
  'Наклонный жим гантелей':'db','Отрицательный жим (гантели)':'db','Тяга гантели одной рукой':'db','Задняя дельта (гантели)':'db',
  'Бицепс с супинацией':'db','Молотки':'db','Шраги (гантели)':'db','Махи гантелями (в стороны/вперёд/в наклоне)':'db',
  'Жим вверх (тренажёр, плиты)':'side',
  'Подтягивания (гравитрон, помощь)':'assist','Брусья (гравитрон, помощь)':'assist',
  'Брусья (резинка)':'band','Подтягивания (резинка)':'band'
};
// тренажёры, вес на которых нельзя сравнивать между залами
const GS = new Set(['Жим ногами','Горизонтальная тяга (блок)','Вертикальная тяга (блок)','Тяга Т-гриф','Жим вверх (тренажёр, плиты)',
  'Подтягивания (гравитрон, помощь)','Брусья (гравитрон, помощь)','Сгибание ног лёжа','Разгибание ног','Аддуктор/абдуктор (тренажёр)']);
const UNIT = {load:'кг', db:'кг на гантель', side:'кг на сторону', assist:'помощь, кг', band:'резинка'};
const TPL = {
  'Пн': ['Жим ногами','Жим лёжа','Горизонтальная тяга (блок)','Жим вверх (тренажёр, плиты)','Бицепс со штангой','Брусья (гравитрон, помощь)'],
  'Ср': ['Жим ногами','Подтягивания (гравитрон, помощь)','Наклонный жим гантелей','Подъём штанги к подбородку','Узкий жим лёжа','Бицепс с супинацией'],
  'Пт': ['Мёртвая / румынская тяга','Горизонтальная тяга (блок)','Отрицательный жим (гантели)','Тяга гантели одной рукой','Французский жим','Молотки']
};

/* ====================== данные ====================== */
const KEY = 'gymlog.v1';
let mem = null;
function fresh() { return {v:1, sessions:[], custom:{}, lastBackup:null, restSec:180, restV:2, lastGym:1, equip:{}, weights:[], pains:[], sleeps:[], measures:[], goal:null, deload:{start:null, until:null, last:null}, repMin:8, repMax:12}; }
function loadData() {
  try { const t = localStorage.getItem(KEY); if (t) { const o = Object.assign(fresh(), JSON.parse(t)); if (o.restV !== 2) { o.restSec = 180; o.restV = 2; } return o; } } catch(e) {}
  return mem || fresh();
}
let D = loadData();
let saveFail = false;
function save() {
  mem = D;
  try { localStorage.setItem(KEY, JSON.stringify(D)); saveFail = false; } catch(e) { saveFail = true; }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const kindOf = n => D.custom[n] || BASE[n] || (EXBYNAME.has(n) ? (EXBYNAME.get(n).ek === 'dumbbell' ? 'db' : 'load') : 'load');
const isGS = n => GS.has(n) || (EXBYNAME.has(n) && ['machine','cable'].indexOf(EXBYNAME.get(n).ek) >= 0);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = parseFloat(String(v).replace(',','.')); return isNaN(x) ? 0 : x; };
const fmtN = v => (Math.round(v*100)/100).toString().replace('.',',');
const e1 = (w,r) => w*(1+Math.min(r,15)/30);
const work = en => en.sets.filter(s => s.t !== 'w' && s.r > 0);
const dFmt = d => new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
const sortedSessions = () => D.sessions.slice().sort((a,b) => b.date.localeCompare(a.date) || (b.created||0)-(a.created||0));
const findS = id => D.sessions.find(s => s.id === id);
function tonnage(s) {
  let t = 0;
  s.entries.forEach(en => { const k = kindOf(en.ex); if (k==='load'||k==='db') work(en).forEach(x => t += x.w*x.r*(k==='db'?2:1)); });
  return t;
}
function topOf(en) {
  const k = kindOf(en.ex), ws = work(en);
  if (!ws.length) return null;
  if (k==='assist'||k==='band') return {v: ws.reduce((a,s)=>a+s.r,0), txt: ws.map(s => k==='band'?s.r:s.w+'×'+s.r).join(' · ')};
  let b = null; ws.forEach(s => { const e = e1(s.w,s.r); if (!b || e > b.e) b = {e, s}; });
  return {v:b.e, txt:b.s.w+'×'+b.s.r};
}
function entryMatches(en, name, gym) { return en.ex === name && (!isGS(name) || (en.gym||1) === gym); }
function prevFor(name, gym, sid, date) {
  const list = sortedSessions().filter(s => s.id !== sid && s.date <= date);
  for (const s of list) { const en = s.entries.find(e => entryMatches(e, name, gym) && work(e).length); if (en) return {date:s.date, en}; }
  return null;
}
function histFor(name, gym, sid, date, n) {
  const out = [];
  for (const s of sortedSessions()) {
    if (s.id === sid || s.date > date) continue;
    const en = s.entries.find(e => entryMatches(e, name, gym) && work(e).length);
    if (en) { out.push({d:s.date, sets:work(en), note:en.note||''}); if (out.length >= (n||5)) break; }
  }
  return out;
}
function planFor(s, en) {
  const k = kindOf(en.ex), gym = en.gym || s.gym || 1;
  const hist = histFor(en.ex, gym, s.id, s.date, 5);
  const alt = (!hist.length && isGS(en.ex)) ? histFor(en.ex, gym === 1 ? 2 : 1, s.id, s.date, 1) : [];
  const sl = (D.sleeps||[]).find(x => x.d === s.date);
  let hard = 0;
  s.entries.forEach(x => { if (x !== en && x.sets.length && x.ex !== en.ex) { const a = (EXDB.find(e => dbName(e) === x.ex)||{}).pm, b = (EXDB.find(e => dbName(e) === en.ex)||{}).pm; if (a && b && a.join() === b.join()) hard += work(x).filter(q => q.rir === undefined || q.rir <= 2).length; } });
  return COACH.plan({name:en.ex, kind:k, hist:hist, alt:alt, today:s.date, range:RANGE(), deload:deloadActive(), pains:D.pains, sleepH: sl ? sl.h : null, sessionHard:hard});
}
function bestBefore(name, gym, sid) {
  let b = 0;
  D.sessions.forEach(s => { if (s.id === sid) return; s.entries.forEach(en => { if (entryMatches(en,name,gym)) { const t = topOf(en); if (t && t.v > b) b = t.v; } }); });
  return b;
}
function useCount() {
  const c = {}; D.sessions.forEach(s => s.entries.forEach(e => c[e.ex] = (c[e.ex]||0)+1)); return c;
}
function allNames() {
  const c = useCount(); const names = new Set([...Object.keys(BASE), ...Object.keys(D.custom), ...Object.keys(c), ...EXDB.map(dbName)]);
  return [...names].sort((a,b) => (c[b]||0)-(c[a]||0) || a.localeCompare(b,'ru'));
}

/* ====================== UI ====================== */
const UI = {tab:'today', edit:null, prog:null, progGym:0, rest:0, q:'', muscle:'', onlyEq:false, bgym:1};
const $ = id => document.getElementById(id);
function toast(msg, ms=2600) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; $('toasthost').appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function curSession() { return UI.edit ? findS(UI.edit) : D.sessions.find(s => s.date === todayStr() && !s.done); }

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === UI.tab));
  let h = '';
  try {
    if (window.COACH_V !== 3 || window.BODY_V !== 3) throw new Error('версии файлов не совпадают (coach.js=' + window.COACH_V + ', body.js=' + window.BODY_V + '): на GitHub загружены не все 4 файла или кэш старый');
    if (UI.edit) h = editorView(findS(UI.edit), true);
    else if (UI.tab === 'today') { const s = D.sessions.find(x => x.date === todayStr() && !x.done); h = s ? editorView(s, false) : startView(); }
    else if (UI.tab === 'hist') h = histView();
    else if (UI.tab === 'base') h = baseView();
    else if (UI.tab === 'prog') h = progView();
    else if (UI.tab === 'body') h = bodyView();
    else h = moreView();
  } catch (err) {
    h = '<div class="banner"><b>Ошибка при показе экрана.</b> Данные не потеряны. Сообщите разработчику этот текст:<br><code>' + esc(String(err && err.message || err)) + ' · ' + esc(String(err && err.stack || '').split('\n').slice(0, 3).join(' | ')) + '</code><br>Попробуйте закрыть приложение и открыть заново (обновятся файлы).</div>';
  }
  $('view').innerHTML = (saveFail ? '<div class="banner">Не удалось сохранить на телефоне (приватный режим или нет места). Сделайте резервную копию во вкладке «Ещё».</div>' : '') + h;
  const inWorkout = !!UI.edit || (UI.tab === 'today' && D.sessions.some(x => x.date === todayStr() && !x.done));
  $('timerhost').style.display = inWorkout ? '' : 'none';
  tick();
  if (UI.tab === 'prog' && !UI.edit) drawProg();
  if (UI.tab === 'body' && !UI.edit && UI.body === 'photo') loadPhotos();
}

/* ---------- старт ---------- */
const DAYN = {'Пн':'Понедельник', 'Ср':'Среда', 'Пт':'Пятница'};
function noticesHTML() {
  let h = coachNoticesHTML();
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !D.tipInstall)
    h += '<div class="banner">Чтобы пользоваться как обычным приложением: нажмите в Safari кнопку «Поделиться» (квадрат со стрелкой) → «На экран “Домой”». <button class="btn sm" data-act="tipinstall">Понятно</button></div>';
  if (D.sessions.some(x => String(x.id).indexOf('imp-') !== 0 && x.entries.some(e => e.sets.length))) {
    const days = D.lastBackup ? Math.floor((Date.now()-D.lastBackup)/864e5) : null;
    if (days === null || days > 14) h += '<div class="banner">'+(days === null ? 'Вы ещё не делали резервную копию.' : 'Резервной копии уже '+days+' дн.')+' Если телефон потеряется или данные сотрутся, история пропадёт. <button class="btn sm" data-act="gotomore">Сделать копию</button></div>';
  }
  return h;
}
function startView() {
  const last = sortedSessions()[0];
  const days = Math.floor((new Date(todayStr()) - new Date(last ? last.date : todayStr()))/86400000);
  let h = '<h1>Начать тренировку</h1>' + noticesHTML();
  D.sessions.filter(x => x.date === todayStr() && x.done).forEach(x => {
    h += '<div class="tip ok"><b>✓ Сегодня уже записана тренировка</b> (подходов: ' + x.entries.reduce((a, e) => a + work(e).length, 0) + ', поднято ' + fmtN(tonnage(x)) + ' кг). Ниже можно начать ещё одну. <button class="btn sm" data-act="open" data-id="' + x.id + '">Открыть и поправить</button></div>';
  });
  if (!D.sessions.length) h += '<div class="card" style="border-color:var(--blue)"><b>Как это работает</b><ol class="how"><li>Если у вас есть файл с историей тренировок, загрузите его: «Ещё» → «Загрузить историю».</li><li>Ниже выберите зал и тренировку.</li><li>Записывайте подходы: вес и повторы. Всё сохраняется на телефоне само.</li></ol><button class="btn block" data-act="gotomore">Загрузить историю…</button></div>';
  h += (last ? '<div class="muted" style="margin:-6px 2px 8px">Последняя тренировка: '+esc(dFmt(last.date))+' ('+(days === 0 ? 'сегодня' : days+' дн. назад')+')</div>' : '')
    + '<div class="card"><div class="muted" style="margin-bottom:6px">1. В каком вы зале?</div><div class="seg" id="gymseg">'
    + [1,2].map(g => '<button data-act="gym" data-g="'+g+'" class="'+(D.lastGym===g?'on':'')+'">Зал №'+g+'</button>').join('')+'</div></div>'

function startSession(tpl, date) {

function stepper(f, i, j, v, step) {

/* ---------- прогресс ---------- */
/* ---------- вес тела ---------- */
const wSorted = () => (D.weights || []).slice().sort((a, b) => a.d.localeCompare(b.d));
function addWeight(d, kg) {
  kg = num(kg);
  if (!/^\d{4}-\d\d-\d\d$/.test(d || '') || !(kg >= 30 && kg <= 300)) return false;
  D.weights = D.weights || [];
  const e = D.weights.find(x => x.d === d);
  if (e) e.kg = kg; else D.weights.push({d, kg});
  save(); return true;
}
function dayStr(offset) { const d = new Date(); d.setDate(d.getDate() - offset); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weightCard() {
  const ws = wSorted(), last = ws[ws.length-1], t = ws.find(x => x.d === todayStr());
  return '<div class="card"><div class="row"><b class="sp">Вес тела</b>'+(last ? '<span class="muted">Последний: '+fmtN(last.kg)+' кг ('+last.d.slice(8)+'.'+last.d.slice(5,7)+')</span>' : '')+'</div>'
    + '<div class="row" style="margin-top:8px"><input id="wtoday" inputmode="decimal" placeholder="Например, 102,5" value="'+(t ? fmtN(t.kg) : '')+'"><button class="btn" data-act="wsave">'+(t ? 'Изменить' : 'Записать')+'</button></div>'
    + '<div class="muted" style="margin-top:6px">'+(t ? 'Сегодня записано ✓. ' : '')+'Взвешивайтесь утром, после туалета и до еды — так цифры сравнимы. Достаточно 1–3 раз в неделю.</div></div>' + sleepQuickCard();
}
function weightChart(ws) {
  const W = 360, H = 190, PL = 34, PR = 12, PT = 14, PB = 22;
  const t0 = new Date(ws[0].d).getTime(), t1 = Math.max(new Date(ws[ws.length-1].d).getTime(), t0 + 7*864e5);
  const vs = ws.map(p => p.kg), lo = Math.min(...vs), hi = Math.max(...vs), pd = Math.max((hi-lo)*0.2, 1);
  const a = lo - pd, b = hi + pd;
  const xs = d => PL + (new Date(d).getTime()-t0)/(t1-t0)*(W-PL-PR), ys = v => PT + (1-(v-a)/(b-a))*(H-PT-PB);
  let s = '<svg viewBox="0 0 '+W+' '+H+'">';
  for (let i = 0; i <= 3; i++) { const v = a+(b-a)*i/3; s += '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="var(--line)"/><text x="'+(PL-4)+'" y="'+(ys(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'; }
  s += '<path d="'+ws.map((p,i) => (i?'L':'M')+xs(p.d).toFixed(1)+' '+ys(p.kg).toFixed(1)).join(' ')+'" fill="none" stroke="var(--blue)" stroke-width="2.5"/>';
  ws.forEach(p => { s += '<circle cx="'+xs(p.d).toFixed(1)+'" cy="'+ys(p.kg).toFixed(1)+'" r="3.5" fill="var(--blue)" stroke="var(--card)" stroke-width="2"/>'; });
  const l = ws[ws.length-1];
  s += '<text x="'+xs(l.d)+'" y="'+(ys(l.kg)-9)+'" text-anchor="end" style="font-weight:700;fill:var(--ink)">'+fmtN(l.kg)+'</text>';
  s += '<text x="'+PL+'" y="'+(H-4)+'">'+ws[0].d.slice(8)+'.'+ws[0].d.slice(5,7)+'</text><text x="'+(W-PR)+'" y="'+(H-4)+'" text-anchor="end">'+l.d.slice(8)+'.'+l.d.slice(5,7)+'</text></svg>';
  return s;
}
function weightView() {
  const ws = wSorted();
  let h = '<div class="card"><b>Записать вес</b><div class="row" style="margin-top:8px"><input type="date" id="wdate" value="'+todayStr()+'" style="max-width:160px"><input id="wkg" inputmode="decimal" placeholder="кг"><button class="btn pri" data-act="wadd">Записать</button></div>'
    + '<div class="muted" style="margin-top:6px">Взвешивайтесь утром, после туалета и до еды. Достаточно 1–3 раз в неделю: смотрите на среднее за неделю, а не на один день.</div></div>';
  if (!ws.length) return h + '<p class="muted">Записей веса пока нет.</p>';
  const avg = (from, to) => { const a = ws.filter(x => x.d >= from && x.d <= to); return a.length ? a.reduce((s, x) => s + x.kg, 0)/a.length : null; };
  const cur = avg(dayStr(6), dayStr(0)), prev = avg(dayStr(34), dayStr(28));
  h += '<div class="card">'+weightChart(ws)+'<div class="muted" style="margin-top:4px">'
    + (cur != null ? 'Среднее за последние 7 дней: <b style="color:var(--ink)">'+fmtN(cur)+' кг</b>. ' : 'За последние 7 дней записей нет. ')
    + (cur != null && prev != null ? '4 недели назад было '+fmtN(prev)+' кг ('+(cur-prev >= 0 ? '+' : '')+fmtN(cur-prev)+' кг).' : '')+'</div></div>'
    + '<div class="card" style="padding:0 6px">'+ws.slice().reverse().map(x => '<div class="li"><div class="sp"><b>'+esc(dFmt(x.d))+'</b></div><div>'+fmtN(x.kg)+' кг</div><button class="x" data-act="wdel" data-d="'+x.d+'" aria-label="Удалить запись" title="Удалить запись">✕</button></div>').join('')+'</div>';
  return h;
}
function progView() {
  const names = allNames().filter(n => D.sessions.some(s => s.entries.some(e => e.ex === n && work(e).length)));
  const opts = names;
  if (!UI.prog || opts.indexOf(UI.prog) < 0) UI.prog = names[0] || null;

function progPoints() {
  const name = UI.prog, gym = isGS(name) ? (UI.progGym||1) : 0, pts = [];
  sortedSessions().slice().reverse().forEach(s => s.entries.forEach(en => {
    if (en.ex !== name || (gym && (en.gym||1) !== gym)) return;
    const t = topOf(en); if (t) pts.push({d:s.date, v:t.v, txt:t.txt, all:setsTxt(en)});
  }));
  return pts;
}
function drawProg() {
  const pts = progPoints(), k = kindOf(UI.prog), host = $('progchart');
  if (!host) return;
  if (!pts.length) { host.innerHTML = '<p class="muted">Нет записей.</p>'; $('proglist').innerHTML=''; return; }
  const W=360,H=210,PL=34,PR=10,PT=16,PB=22;
  const t0 = new Date(pts[0].d).getTime(), t1 = Math.max(new Date(pts[pts.length-1].d).getTime(), t0+7*864e5);
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), pad = (hi-lo||hi*0.1||1)*0.15;
  const a = lo-pad, b = hi+pad;
  const xs = d => PL + (new Date(d).getTime()-t0)/(t1-t0)*(W-PL-PR), ys = v => PT + (1-(v-a)/(b-a))*(H-PT-PB);
  let s = '<svg viewBox="0 0 '+W+' '+H+'">';
  for (let i = 0; i <= 3; i++) { const v = a+(b-a)*i/3; s += '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="var(--line)"/><text x="'+(PL-4)+'" y="'+(ys(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'; }
  s += '<path d="'+pts.map((p,i) => (i?'L':'M')+xs(p.d).toFixed(1)+' '+ys(p.v).toFixed(1)).join(' ')+'" fill="none" stroke="var(--blue)" stroke-width="2.5"/>';
  let bi = 0; pts.forEach((p,i) => { if (p.v > pts[bi].v) bi = i; });
  pts.forEach((p,i) => { s += '<circle cx="'+xs(p.d).toFixed(1)+'" cy="'+ys(p.v).toFixed(1)+'" r="'+(i===bi?5:3.5)+'" fill="'+(i===bi?'var(--good)':'var(--blue)')+'" stroke="var(--card)" stroke-width="2"/>'; });
  s += '<text x="'+xs(pts[bi].d)+'" y="'+(ys(pts[bi].v)-9)+'" text-anchor="middle" style="font-weight:700;fill:var(--ink)">'+esc(pts[bi].txt)+'</text>';
  s += '<text x="'+PL+'" y="'+(H-4)+'">'+pts[0].d.slice(8)+'.'+pts[0].d.slice(5,7)+'</text><text x="'+(W-PR)+'" y="'+(H-4)+'" text-anchor="end">'+pts[pts.length-1].d.slice(8)+'.'+pts[pts.length-1].d.slice(5,7)+'</text></svg>';
  host.innerHTML = '<div class="muted" style="margin-bottom:4px">'+(k==='assist'||k==='band' ? 'Всего повторов за тренировку (чем больше, тем лучше)' : 'Оценка вашего максимума на 1 повтор, кг (чем выше, тем сильнее)')+'</div>'+s
    + '<div class="muted" style="margin-top:4px">Рекорд: <b style="color:var(--good)">'+esc(pts[bi].txt)+'</b> · '+esc(dFmt(pts[bi].d))+'</div>';
  $('proglist').innerHTML = pts.slice().reverse().map(p => '<div class="li"><div class="sp"><b>'+esc(dFmt(p.d))+'</b></div><div style="text-align:right">'+esc(p.all)+'</div></div>').join('');
}

/* ---------- ещё ---------- */
function usageInfo() {
  let used = 0, ok = true;
  try { used = (localStorage.getItem(KEY) || '').length; } catch (e) { ok = false; }
  const n = D.sessions.length, per = n ? used / n : 2500, cap = 2500000;   // 2,5 млн знаков ≈ 5 МБ — осторожная оценка
  const years = Math.floor(Math.max(0, cap - used) / (per * 156));            // 3 тренировки в неделю
  return {ok, bytes: used * 2, n, years};
}
function usageHTML() {
  const u = usageInfo();
  return '<div class="card"><h2 style="margin-top:0">Память телефона</h2><div class="muted">'
    + (u.ok ? 'Приложение занимает около '+Math.max(1, Math.round(u.bytes/1024))+' КБ (тренировок: '+u.n+'). Браузер выделяет на такие данные примерно 5 МБ. При 3 тренировках в неделю места хватит ещё '+(u.years > 50 ? 'более 50 лет' : 'примерно '+u.years+' лет')+'. Фото и описания упражнений в эту память не входят.' : 'Не удалось определить: хранилище недоступно.')
    + '</div></div>';
}

/* ====================== импорт / экспорт ====================== */
function parsePipe(text) {
  const m = text.match(/RAW\s*=\s*`([\s\S]*?)`/); const body = m ? m[1] : text;
  const by = {};
  body.split('\n').forEach(l => {
    l = l.trim(); if (!l || l.startsWith('//')) return;
    const p = l.split('|'); if (p.length < 4 || !/^\d{4}-\d\d-\d\d$/.test(p[0])) return;
    const [d,g,ex,sets] = p, note = p.slice(4).join('|');
    const k = BASE[ex] || 'load';
    const ss = sets ? sets.split(',').map(x => { const [w,r] = x.split('x').map(Number); return {w:k==='band'?0:w, r}; }) : [];
    (by[d] = by[d] || []).push({ex, gym:+g===2?2:1, sets:ss, note});
  });
  return Object.keys(by).sort().map(d => ({id:'imp-'+d, date:d, gym:by[d][0].gym, created:new Date(d).getTime(), entries:by[d], note:''}));
}
function importText(text) {
  let sessions = [], custom = {}, weights = [], extra = null;
  try { const o = JSON.parse(text); sessions = o.sessions || []; custom = o.custom || {}; weights = o.weights || []; extra = o; }
  catch(e) { sessions = parsePipe(text); }
  if (!Array.isArray(sessions)) sessions = [];
  if (!Array.isArray(weights)) weights = [];
  const hasBody = extra && typeof extra === 'object' && ['pains', 'sleeps', 'measures'].some(k => Array.isArray(extra[k]) && extra[k].length);
  if (!sessions.length && !weights.length && !hasBody) { toast('В файле не нашлось тренировок'); return; }
  const have = new Set(D.sessions.map(s => s.id)); let added = 0, addedW = 0;
  sessions.forEach(s => { if (s && s.id && s.date && Array.isArray(s.entries) && !have.has(s.id)) { if (s.done === undefined && String(s.id).indexOf('imp-') === 0) s.done = true; D.sessions.push(s); added++; } });
  D.weights = D.weights || [];
  weights.forEach(w => { if (w && /^\d{4}-\d\d-\d\d$/.test(w.d || '') && w.kg >= 30 && w.kg <= 300 && !D.weights.some(x => x.d === w.d)) { D.weights.push({d:w.d, kg:+w.kg}); addedW++; } });
  Object.assign(D.custom, custom); mergeBody(extra); save(); render();
  toast('Добавлено тренировок: '+added+(addedW ? ', записей веса: '+addedW : ''));
}
async function shareFile(name, mime, content) {
  const blob = new Blob([content], {type:mime}), file = new File([blob], name, {type:mime});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return true; } } catch(e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true;
}
async function doExport() {
  const ok = await shareFile('gymlog-backup-'+todayStr()+'.json', 'application/json', JSON.stringify(D, null, 1));
  if (ok) { D.lastBackup = Date.now(); save(); render(); toast('Копия сохранена'); }
}
async function doCsv() {

/* ====================== таймер отдыха ====================== */
let tmr = null;
function beep() { try { const c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.2; o.start(); setTimeout(() => { o.stop(); c.close(); }, 450); } catch(e) {} if (navigator.vibrate) navigator.vibrate(300); }
function startRest(sec) { UI.rest = Date.now() + (sec || D.restSec) * 1000; UI.pause = 0; UI.tmenu = false; clearInterval(tmr); tmr = setInterval(tick, 250); tick(); }
function mmss(n) { n = Math.max(0, Math.ceil(n)); return Math.floor(n/60) + ':' + pad(n%60); }
// кнопка таймера: всегда на экране тренировки; перерисовывается только при смене вида, чтобы нажатие не терялось
function tick() {
  const host = $('timerhost'); if (!host) return;
  let key, label, cls = 'timer', menu = '';
  if (UI.pause) { key = 'p'; label = '⏸ Пауза ' + mmss(UI.pause / 1000); }
  else if (!UI.rest) { key = 'i'; cls = 'timer idle'; label = '⏱ Отдых ' + mmss(D.restSec); }
  else {
    const left = Math.ceil((UI.rest - Date.now()) / 1000);
    if (left <= 0) { key = 'd'; cls = 'timer done'; label = 'Отдых закончен ✓ · закрыть'; if (UI.rest > 0) { beep(); UI.rest = -1; clearInterval(tmr); } }
    else { key = 'r'; label = '⏱ Отдых ' + mmss(left); }
  }
  if (UI.rest === -1 && key !== 'd') { key = 'd'; cls = 'timer done'; label = 'Отдых закончен ✓ · закрыть'; }
  const act = key === 'i' ? 'timerstart' : key === 'd' ? 'timerstop' : 'timermenu';
  const showMenu = UI.tmenu && (key === 'r' || key === 'p');
  const k2 = key + (showMenu ? 'm' : '');
  if (host.dataset.k !== k2) {
    if (showMenu) menu = '<div class="tmenu"><button data-act="timeradd">+15 с</button><button data-act="timerpause">' + (key === 'p' ? '▶ Дальше' : '⏸ Пауза') + '</button><button data-act="timerstop">Сбросить</button></div>';
    host.innerHTML = menu + '<button class="' + cls + '" data-act="' + act + '">' + label + '</button>';
    host.dataset.k = k2;
  } else { const b = host.querySelector('.timer'); if (b && b.textContent !== label) b.textContent = label; }
}
// автозапуск: когда внесён результат подхода (повторы или «запас»), один раз на подход и не поверх уже идущего отдыха
function autoRest(s, i, j) {
  if (D.autoRest === false) return;
  const x = s.entries[i] && s.entries[i].sets[j]; if (!x || x.t === 'w' || !(x.r > 0)) return;
  const key = s.id + ':' + i + ':' + j; if (UI.timed === key) return;

}

const EXBYNAME = new Map(); EXDB.forEach(e => { EXBYNAME.set(e.ru, e); e.alias.forEach(a => EXBYNAME.set(a, e)); });

const FORCE = {push:'жим', pull:'тяга', static:'статика'};
const KLAB = {org:'организация', coach:'тренер / эксперт', media:'издание'};
function equipFor(g) { const a = D.equip && D.equip[g]; return new Set(a || Object.keys(EQ)); }
function scoreAnalog(a, b) {
  const sh = (x, y) => x.filter(v => y.indexOf(v) >= 0).length;
  const p = sh(a.pk, b.pk); if (!p) return 0;
  return 6 + 2*p + 2*sh(a.sk, b.sk) + (a.force && a.force === b.force ? 2 : 0) + (a.mech && a.mech === b.mech ? 2 : 0) + (a.ek === b.ek ? 1 : 0) + (a.pk[0] === b.pk[0] ? 3 : 0);
}
function analogsOf(src, gym, all, limit) {
  const eq = equipFor(gym);
  const pool = EXDB.filter(x => x.id !== src.id && (all || eq.has(x.ek)));
  let list = pool.map(x => ({x, s:scoreAnalog(src, x)})).filter(r => r.s > 0);
  if (!list.length) {   // по главной мышце аналогов нет — ищем по вспомогательным
    const sh = (a, b) => a.filter(v => b.indexOf(v) >= 0).length;
    list = pool.map(x => ({x, s: 3*sh(src.pk, x.sk) + 2*sh(src.sk, x.pk)})).filter(r => r.s > 0);

  return list.sort((a, b) => b.s - a.s || a.x.ru.localeCompare(b.x.ru, 'ru')).slice(0, limit || 14);

    case 'rmex': if (confirm('Убрать «'+s.entries[i].ex+'» из тренировки?')) { s.entries.splice(i,1); save(); render(); } break;
    case 'rmset': s.entries[i].sets.splice(j,1); save(); render(); break;
    case 'rir': { const x = s.entries[i].sets[j], v = +t.dataset.v; x.rir = x.rir === v ? undefined : v; UI.last = {sid:s.id, i:i, j:j}; save(); if (x.rir !== undefined) autoRest(s, i, j); render(); break; }
    case 'dirty': { const x = s.entries[i].sets[j]; x.dirty = x.dirty ? undefined : true; UI.last = {sid:s.id, i:i, j:j}; save(); render(); break; }
    case 'warm': { const x = s.entries[i].sets[j]; x.t = x.t === 'w' ? undefined : 'w'; save(); render(); break; }
    case 'addset': {
      const en = s.entries[i], last = en.sets[en.sets.length-1];
      const pl = planFor(s, en), nw = en.sets.filter(q => q.t !== 'w').length, tg = pl.targets && pl.targets.length ? (pl.targets[nw] || pl.targets[pl.targets.length-1]) : null;
      let src = last || {w:0, r:0};
      if (tg && (!last || last.t === 'w' || nw === 0)) src = {w:tg.w, r:tg.r};
      else if (last && last.t !== 'w' && tg && tg.w === last.w) src = {w:last.w, r:Math.max(tg.r, 1)};
      const had = en.sets.length;
      en.sets.push({w:src.w, r:src.r}); save(); render();
      break;
    }
    case 'step': {
      const x = s.entries[i].sets[j], f = t.dataset.f, d = +t.dataset.d; x[f] = Math.max(0, Math.round((x[f] + d)*100)/100); UI.last = {sid:s.id, i:i, j:j}; save(); if (f === 'r') autoRest(s, i, j); render(); break;
    }
    case 'addex': openPicker(); break;
    case 'closepick': if (e.target === t) $('modalhost').innerHTML = ''; break;
    case 'pick': { const nm = t.dataset.name; s.entries.push({ex:nm, gym:s.gym||D.lastGym, sets:[], note:''}); $('modalhost').innerHTML = ''; save(); render(); break; }
    case 'newex': { const nm = t.dataset.name; if (!nm) break; D.custom[nm] = $('newkind').value; s.entries.push({ex:nm, gym:s.gym||D.lastGym, sets:[], note:''}); $('modalhost').innerHTML = ''; save(); render(); break; }
    case 'delses': if (confirm('Удалить эту тренировку целиком?')) { D.sessions = D.sessions.filter(x => x.id !== s.id); UI.edit = null; save(); render(); } break;
    case 'pgym': UI.progGym = +t.dataset.g; render(); break;
    case 'export': doExport(); break;
    case 'csv': doCsv(); break;
    case 'wipe': if (confirm('Стереть ВСЕ тренировки на этом телефоне? Это нельзя отменить.') && confirm('Точно стереть? Лучше сначала сделать копию.')) { D = fresh(); save(); render(); } break;
    case 'info': { const ex = t.dataset.id ? EXBYID.get(t.dataset.id) : findEx(t.dataset.name); if (ex) openDetail(ex); else toast('Для этого упражнения в базе пока нет карточки'); break; }
    case 'swap': openSwap(s, i, false); break;
    case 'doswap': {
      const en = s.entries[i], ex = EXBYID.get(t.dataset.id); if (!ex) break;
      if (en.sets.length && !confirm('В упражнении уже записаны подходы. Заменить на «'+ex.ru+'» и очистить их?')) break;
      en.ex = dbName(ex); en.sets = []; $('modalhost').innerHTML = ''; save(); render(); toast('Заменено на «'+en.ex+'»'); break;
    }
    case 'bgym': UI.bgym = +t.dataset.g; render(); break;
    case 'bmus': UI.muscle = t.dataset.m; render(); break;
    case 'eqtoggle': {
      const g = UI.bgym, cur = equipFor(g), k = t.dataset.k; if (cur.has(k)) cur.delete(k); else cur.add(k);
      D.equip = D.equip || {}; D.equip[g] = [...cur]; save(); render(); break;
    }
    case 'wsave': { const ok = addWeight(todayStr(), $('wtoday').value); if (ok) { render(); toast('Вес записан'); } else toast('Введите вес в килограммах, например 102,5'); break; }
    case 'wadd': { const ok = addWeight($('wdate').value || todayStr(), $('wkg').value); if (ok) { render(); toast('Вес записан'); } else toast('Введите вес в килограммах (от 30 до 300), например 102,5'); break; }
    case 'wdel': if (confirm('Удалить запись веса за '+t.dataset.d+'?')) { D.weights = D.weights.filter(x => x.d !== t.dataset.d); save(); render(); } break;
    case 'gotomore': UI.tab = 'more'; UI.edit = null; render(); window.scrollTo(0,0); break;
    case 'tipdone': D.tipEditor = true; save(); render(); break;
    case 'tipinstall': D.tipInstall = true; save(); render(); break;
    case 'tipreset': D.tipEditor = false; D.tipInstall = false; save(); toast('Подсказки включены: они появятся на вкладке «Сегодня»'); break;
    case 'finish': {
      const n = s.entries.reduce((a, e) => a + work(e).length, 0);
      if (!n) { toast('Пока нет записанных подходов'); break; }
      const recs = [];
      s.entries.forEach(en => { const tp = topOf(en), k = kindOf(en.ex); if (tp && k !== 'assist' && k !== 'band') { const b = bestBefore(en.ex, en.gym || s.gym || 1, s.id); if (b && tp.v > b + 0.01) recs.push(en.ex.split(' (')[0]); } });
      UI.rest = 0; UI.pause = 0; UI.tmenu = false; clearInterval(tmr); tick();
      s.done = true; save();
      UI.edit = null; UI.tab = 'hist'; render(); window.scrollTo(0,0);
      toast('Тренировка записана: подходов '+n+', поднято '+fmtN(tonnage(s))+' кг'+(recs.length ? '. Новые рекорды: '+recs.join(', ') : '')+' 💪', 6000); break;
    }
    case 'timerstart': startRest(); break;
    case 'timermenu': UI.tmenu = !UI.tmenu; tick(); break;
    case 'timeradd': if (UI.pause) UI.pause += 15000; else if (UI.rest > 0) UI.rest += 15000; tick(); break;
    case 'timerpause': if (UI.pause) { UI.rest = Date.now() + UI.pause; UI.pause = 0; clearInterval(tmr); tmr = setInterval(tick, 250); } else if (UI.rest > 0) { UI.pause = Math.max(1000, UI.rest - Date.now()); clearInterval(tmr); } tick(); break;
    case 'timerstop': UI.rest = 0; UI.pause = 0; UI.tmenu = false; clearInterval(tmr); tick(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, s = curSession();
  if (bodyChange(t)) return;
  if (t.id === 'sdate' && s) { s.date = t.value || s.date; save(); render(); return; }
  if (t.id === 'snote' && s) { s.note = t.value; save(); return; }
  if (t.id === 'autorest') { D.autoRest = t.checked; save(); return; }
  if (t.id === 'bonly') { UI.onlyEq = t.checked; const b = $('blist'); if (b) b.innerHTML = baseList(); return; }
  if (t.id === 'swapall' && s) { openSwap(s, +t.dataset.i, t.checked); return; }
  if (t.id === 'progsel') { UI.prog = t.value; UI.progGym = 0; render(); return; }
  if (t.id === 'restsec') { D.restSec = Math.max(10, Math.round(num(t.value)) || 90); save(); return; }
  if (t.id === 'impfile') { const f = t.files[0]; if (f) f.text().then(importText); return; }
  if (!s || t.dataset.i === undefined) return;
  const i = +t.dataset.i, en = s.entries[i];
  if (t.dataset.f === 'note') { en.note = t.value; save(); return; }
  const j = +t.dataset.j, f = t.dataset.f; if (!en.sets[j]) return;
  en.sets[j][f] = num(t.value); UI.last = {sid:s.id, i:i, j:j}; save(); if (f === 'r') autoRest(s, i, j);
  const top = topOf(en), g = en.gym||s.gym||1, k = kindOf(en.ex);
  if (top && f === 'r' && en.sets[j].t !== 'w' && k !== 'assist' && k !== 'band') { const b = bestBefore(en.ex, g, s.id); if (b && top.v > b + 0.01) toast('🏆 Новый рекорд: '+top.txt); }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'bq') { UI.q = e.target.value; const b = $('blist'); if (b) b.innerHTML = baseList(); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
render();
applyUrlParams();
</script>
